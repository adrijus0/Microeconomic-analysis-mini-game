<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020802">
  <title>Wasteland Odds</title>
  <meta name="description" content="Four Fallout: New Vegas deals that break the textbook theory of choice, and the theory behind your choices.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/games/allais.css">
</head>
<body class="games-page">
  <a class="skip-link" href="#main">Skip to the game</a>

  <header class="games-bar">
    <a class="games-bar__link" id="back-link" href="index.html">◂ Title</a>
    <span class="games-bar__brand">Wasteland Odds</span>
    <span class="games-bar__rad" aria-hidden="true">☢</span>
    <button class="sound-toggle is-on" id="sound-toggle" type="button" title="8-bit sound">♪ Sound on</button>
    <span class="capsbar" id="capsbar" role="img" aria-label="Wallet" hidden>
      <span class="capsbar__icon" aria-hidden="true"></span>
      <span class="capsbar__num" aria-hidden="true">100</span>
    </span>
  </header>

  <main id="main" class="games-main" tabindex="-1">
    <section id="view-map" class="view" hidden></section>
    <section id="view-game" class="view view--game" hidden></section>
    <section id="view-report" class="view" hidden></section>
    <noscript>
      <div class="stage report-empty">
        <p>The game needs JavaScript. The title screen still works without it.</p>
        <p><a href="index.html">Back to the title screen</a></p>
      </div>
    </noscript>
  </main>

  <script src="config.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/store.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/figures.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/props.js"></script>
  <script src="js/games/stpetersburg.js"></script>
  <script src="js/games/allais.js"></script>
  <script src="js/games/ellsberg.js"></script>
  <script src="js/games/lossaversion.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
